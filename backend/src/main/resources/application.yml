server:
  # 8080 常被别的本地服务占用，这里固定 8081
  port: 8081
  # 只监听本机回环地址，内容写接口不会暴露到局域网
  address: 127.0.0.1

spring:
  application:
    name: personal-site-backend
  profiles:
    # 默认加载 application-local.yml（里面是本机数据库密码，已被 .gitignore 排除）
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/personal_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    # 真实密码放在 application-local.yml（已在 .gitignore 里），不要写进这个文件
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  jackson:
    # 前端用 `id`/`to` 只有一个有值，null 字段不输出，省得两边都判空
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

logging:
  level:
    com.gilmmerr.site: info
